# Episode sandboxes as Modal Sandboxes, for training inside Modal GPU containers where Docker is unavailable.
# Replaces sandbox_docker.yaml (same `sandbox` name). Set BDRL_WORLDS_ROOT to the Modal Volume holding the worlds
# (target-rl-worlds); the biodiscovery server mounts it read-only at /worlds.
sandbox:
  default_metadata:
    sandbox-api: modal
  modal:
    app_name: target-rl-episodes
    block_network: true
    images:
      # Published by nemo-RL examples/nemo_gym/target_rl/modal_images.py; swap for
      # `dockerfile: resources_servers/biodiscovery/toolkit/Dockerfile` to build at first use instead.
      "bdrl-toolkit:latest":
        published: bdrl-toolkit
    default_timeout_s: 600
    concurrency: 128
